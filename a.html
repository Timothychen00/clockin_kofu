<!doctype html>
<html lang="en">

<head>
  <title>Title</title>
  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

  <!-- Bootstrap CSS v5.2.1 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
</head>

<body>

  <div class="row justify-content-center fixed-bottom">
    <div class="col-12  col-lg-12  row justify-content-end  ms-4 pb-2">
      <div class="col-5  shadow row justify-content-center py-2 rounded me-5 mb-2" style="background-color:white">
        <p class="my-2 d-inline h5 ps-3" style="width: 80px;">日期</p>
        <button class="btn pt-2" style="width:50px" onclick="offsetDate(-1)"><ion-icon
            name="chevron-back-outline"></ion-icon></button>
        <input type="date" class="form-control d-inline mx-2" id="date" style="width:150px">
        <button class="btn pt-2" style="width:50px" onclick="offsetDate(1)"><ion-icon
            name="chevron-forward-outline"></ion-icon></button>

      </div>
    </div>
  </div>

  <script>
    function offsetDate(offset) {
      date = document.getElementById('date');
      console.log('as date:', date.valueAsDate);
      if (!date.valueAsDate) {
        currentDate = new Date()
      } else {
        currentDate = new Date(date.valueAsDate);
        currentDate.setDate(currentDate.getDate() + offset);
      }

      date.valueAsDate = currentDate;
      load_notification();
    }

  </script>

  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
    integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
    crossorigin="anonymous"></script>
</body>

</html>
